name: Weekly rebuild
# Rebuilds the site every Monday so GitHub project cards stay current.
# Needs one repo secret: CF_DEPLOY_HOOK (Cloudflare Pages > Settings > Builds > Deploy hooks).
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK is not set; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
